name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run specs
        run: bundle exec rspec
      - name: Coverage summary
        if: always() && matrix.ruby == '3.3'
        run: |
          {
            echo '### Coverage'
            ruby -rjson -e 'r = JSON.parse(File.read("coverage/.last_run.json"))["result"]; puts "- Line: #{r["line"]}%"; puts "- Branch: #{r["branch"]}%"'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always() && matrix.ruby == '3.3'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop
