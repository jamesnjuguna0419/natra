development:
  adapter: postgresql
  encoding: unicode
  database: <%%= ENV.fetch('DEV_DATABASE', 'development_<%= @name.directory_name %>') %>
  pool: 5
production:
  adapter: postgresql
  encoding: unicode
  database: <%%= ENV.fetch('PROD_DATABASE', 'production_<%= @name.directory_name %>') %>
  pool: 5
test:
  adapter: postgresql
  encoding: unicode
  database: <%%= ENV.fetch('TEST_DATABASE', 'test_<%= @name.directory_name %>') %>
  pool: 5
