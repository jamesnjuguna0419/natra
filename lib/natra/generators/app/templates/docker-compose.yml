services:
  web:
    build:
      context: .
      target: development
    command: bundle exec puma -C config/puma.rb
    volumes:
      - .:/usr/src/app
    ports:
      - '9292:9292'
    depends_on:
      - db
    env_file: secrets.env
  db:
    image: postgres:17-alpine
    ports:
      - "54329:5432"
    env_file: secrets.env
